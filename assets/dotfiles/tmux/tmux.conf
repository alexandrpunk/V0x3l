#--------------------------------------------------
# tmux.conf
#--------------------------------------------------

source-file "~/.config/tmux/conf/env.tmux"
source-file "~/.config/tmux/conf/base.tmux"
source-file "~/.config/tmux/conf/bind.tmux"
source-file "~/.config/tmux/conf/style.tmux"
source-file "~/.config/tmux/conf/plugin.tmux"

# Paleta Sonokai (Gogh)
# Normal:  black red green yellow blue magenta cyan white
set -g terminal-overrides ",xterm-256color:Tc"
set -g default-terminal "tmux-256color"

# Colores Sonokai
set -g status-style "bg=#2C2E34,fg=#E2E2E3"
set -g pane-border-style "fg=#7F8490"
set -g pane-active-border-style "fg=#76CCE0"
set -g message-style "bg=#FC5D7C,fg=#181819"
set -g message-command-style "bg=#FC5D7C,fg=#181819"
set -g mode-style "bg=#E7C664,fg=#181819"

# Status bar
set -g status-left "#[bg=#9ED072,fg=#181819] #S "
set -g status-right "#[bg=#B39DF3,fg=#181819] %H:%M "
set -g status-left-length "100"
set -g status-right-length "100"

# Window tabs
set -g window-status-current-style "bg=#76CCE0,fg=#181819"
set -g window-status-style "bg=#2C2E34,fg=#E2E2E3"

# Copy mode
set -g copy-mode-current-mode-style "bg=#F39660,fg=#181819"

# example file: 
# /usr/share/doc/tmux/example_tmux.conf
#
# show-options command (inside tmux):
# tmux show -g
# tmux show -g | sed 's/^/set-option -g /'

# kitty.conf — portado desde assets/dotfiles/foot.config (eliminado)
# Paleta: Nord. Valores no comentados = ajustes activos en el foot.ini original.

# ── Fuente ──
font_family      Hack Nerd Font Mono
font_size        10.0

# ── Ventana / padding ──
# pad=20x20 en foot
window_padding_width 20
hide_window_decorations yes
# foot: locked-title=no
allow_remote_control no

# ── Cursor ──
cursor_style block
cursor_blink_interval 0
cursor_shape_unfocused hollow

# ── Mouse / scrollback ──
mouse_hide_wait 3.0
scrollback_lines 1000
scrollback_multiplier 3.0

# ── Nord palette (foot regular0-7 / bright0-7) ──
foreground #D8DEE9
background #2E3440
selection_foreground #2E3440
selection_background #D8DEE9

# black / bright black
color0  #3B4252
color8  #4C566A
# red / bright red
color1  #BF616A
color9  #BF616A
# green / bright green
color2  #A3BE8C
color10 #A3BE8C
# yellow / bright yellow
color3  #EBCB8B
color11 #EBCB8B
# blue / bright blue
color4  #81A1C1
color12 #81A1C1
# magenta / bright magenta
color5  #B48EAD
color13 #B48EAD
# cyan / bright cyan
color6  #88C0D0
color14 #8FBCBB
# white / bright white
color7  #E5E9F0
color15 #ECEFF4

# ── URLs ──
url_style curly
open_url_with default
detect_urls yes

# foot: Control+Shift+c / Control+Shift+v / Control+Shift+r (search)
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+r show_scrollback
# foot: Control+plus/minus/0 (font size)
map ctrl+shift+equal change_font_size all +0.5
map ctrl+shift+minus change_font_size all -0.5
map ctrl+shift+backspace change_font_size all 0
# foot: spawn-terminal=Control+Shift+n
map ctrl+shift+n launch --type=window
# foot: show-urls-launch=Control+Shift+u
map ctrl+shift+u open_url_with_hints
